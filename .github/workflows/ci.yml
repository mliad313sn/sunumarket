name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  DATABASE_URL: postgresql://sunu:sunu@localhost:5432/sunumarket
  REDIS_URL: redis://localhost:6379

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sunu
          POSTGRES_PASSWORD: sunu
          POSTGRES_DB: sunumarket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sunu -d sunumarket"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/coverage-summary.json
            apps/*/coverage/coverage-summary.json
          if-no-files-found: ignore
      - run: pnpm test:e2e
